spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-pricing
  template:
    metadata:
      labels:
        app: legacy-pricing
    spec:
      serviceAccountName: legacy-pricing
      containers:
      - name: httpbin
        image: docker.io/mccutchen/go-httpbin:v2.15.0
        imagePullPolicy: IfNotPresent
        env:
        - name: USE_REAL_HOSTNAME   # /hostname returns the pod name
          value: "true"
        ports:
        - containerPort: 8080
