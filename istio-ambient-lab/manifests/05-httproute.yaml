# Carousel slide 9, verbatim: 90/10 split and a 2s request timeout,
# applied by the waypoint. Apply with -n trading.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-b
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: service-b
    port: 8080
  rules:
  - backendRefs:
    - name: service-b-v1
      port: 8080
      weight: 90
    - name: service-b-v2
      port: 8080
      weight: 10
    timeouts:
      request: 2s
